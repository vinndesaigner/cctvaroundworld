<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REALTIME CCTV WORLD</title>
  <link rel="icon" type="image/jpg" href="foto.jpg">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary: #00ff41;
      --bg: #070707;
      --panel: #0d0d0d;
      --border: 1px solid #1a331a;
      --alert: #ff003c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: #ccc;
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 11px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: var(--border);
      background: var(--panel);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .title { color: var(--primary); font-weight: bold; }
    .sys-info { color: #00e5ff; }
    .blink { animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    .main-content {
      display: flex;
      flex: 1;
      height: calc(100vh - 35px);
    }

    .cctv-matrix {
      flex: 3.5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      background: #000;
    }

    .cctv-card {
      position: relative;
      background: #000;
      border: 1px solid #182218;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cctv-card:hover { border-color: var(--primary); }

    .feed-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      z-index: 10;
      pointer-events: none;
    }

    .feed-tag { color: #fff; font-size: 9px; letter-spacing: 0.5px; }
    .feed-tag span { color: var(--primary); font-weight: bold; }
    .rec-badge { color: var(--alert); font-size: 9px; font-weight: bold; }

    /* Video Player Iframe YouTube */
    iframe {
      width: 140%;             
      height: 140%;            
      margin-top: -12%;        
      margin-left: -20%;       
      border: none;
      filter: contrast(110%) brightness(95%);
      pointer-events: none;    
    }
    /* Efek Scanline Garis CCTV */
    .scanlines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.4) 0px,
        rgba(0, 0, 0, 0.4) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 4;
      pointer-events: none;
    }
    
    /* Tampilan Offline / URL Kosong */
    .offline-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, #000 0px, #000 2px, #0a0a0a 2px, #0a0a0a 4px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--alert);
      font-weight: bold;
      z-index: 2;
      font-size: 11px;
    }

    .sidebar {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      border-left: var(--border);
      background: var(--panel);
      padding: 4px;
    }

    .sidebar-title {
      color: var(--primary);
      padding: 4px 6px;
      font-weight: bold;
      border-bottom: var(--border);
      margin-bottom: 4px;
    }

    #map {
      flex: 1;
      border: var(--border);
      background: #000;
    }

    .leaflet-tile-pane { filter: brightness(0.65) contrast(1.3) hue-rotate(80deg) saturate(180%); }

    .logs-panel {
      height: 130px;
      margin-top: 4px;
      border: var(--border);
      padding: 6px;
      overflow-y: auto;
      font-size: 10px;
      background: #050505;
      color: #888;
      line-height: 1.4;
    }
    .logs-panel div.ok { color: var(--primary); }
    .logs-panel div.err { color: var(--alert); }
  </style>
</head>
<body>

  <header>
    <div class="title">GLOBAL CCTV MATRIX</div>
    <div class="sys-info">STREAM: <span class="blink">ONLINE</span></div>
    <div id="live-clock">00:00:00 WIB</div>
  </header>

  <div class="main-content">
    <div class="cctv-matrix" id="matrix"></div>

    <div class="sidebar">
      <div class="sidebar-title">[+] GIS SURVEILLANCE RADAR</div>
      <div id="map"></div>
      <div class="logs-panel" id="logs">
        <div class="ok">> SYSTEM REINITIALIZED, HYBRID FEED MODE</div>
        <div class="ok">> HOOKING REALTIME GLOBAL NODES...</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ==========================================================
    // MASUKIN ID YOUTUBE DI SINI (CONTOH: "IFzpwTnv23w")
    // Kalau belum nemu link-nya, biarin kosong ("") biar muncul [ SIGNAL LOST ]
    // ==========================================================
    const cctvNodes = [
      { id: "STK", name: "STOCKHOLM", lat: 59.3346, lng: 18.0672, yt: "agY6ZaM1G_o" },
      { id: "CAN", name: "CANMORE", lat: 51.0890, lng: -115.3596, yt: "_0wPODlF9wU" },
      { id: "SPB", name: "ST. PETERSBURG", lat: 59.9350, lng: 30.3250, yt: "w_Dg2vC0tUE" },
      
      { id: "DUB", name: "DUBLIN", lat: 53.3498, lng: -6.2603, yt: "3nyPER2kzqk" },
      { id: "SEO", name: "SEOUL", lat: 37.5665, lng: 126.9780, yt: "C3hW1VrwmNc" },
      { id: "VEN", name: "VENICE", lat: 45.4365, lng: 12.3300, yt: "Kmf_wiTFuXY" },
      
      // Dua kamera di bawah ini contoh yg sudah diisi live stream YouTube Shibuya & Times Square:
      { id: "TKO", name: "TOKYO", lat: 35.6594, lng: 139.7005, yt: "gFRtAAmiFbE" },
      { id: "NYC", name: "NEW YORK", lat: 40.7580, lng: -73.9855, yt: "JQ_jwk_7OVE" },
      
      { id: "LON", name: "LONDON", lat: 51.5055, lng: -0.0754, yt: "zMCea32gpmg" },
      { id: "PHI", name: "PHILADELPHIA", lat: 39.9526, lng: -75.1652, yt: "9mMnqO1UuIU" },
      { id: "BER", name: "BERLIN", lat: 48.1371, lng: 11.5754, yt: "8djINznvJDs" },
      { id: "MEL", name: "MELBOURNE", lat: -37.8136, lng: 144.9631, yt: "gEbrHdFRgpQ" }
    ];

    const matrix = document.getElementById('matrix');
    const logs = document.getElementById('logs');

    cctvNodes.forEach((node, i) => {
      const card = document.createElement('div');
      card.className = 'cctv-card';
      
      if (node.yt) {
        const embedUrl = `https://www.youtube-nocookie.com/embed/${node.yt}?autoplay=1&mute=1&controls=0&modestbranding=1&loop=1&playsinline=1&rel=0`;
        card.innerHTML = `
          <div class="feed-header">
            <div class="feed-tag"><span>CAM-${String(i+1).padStart(2, '0')}</span> ${node.name}</div>
            <div class="rec-badge"><span class="blink">●</span> REC</div>
          </div>
          <iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
          <div class="scanlines"></div>
        `;
        addLog(`> LINK ESTABLISHED: ${node.id} (${node.name.split('//')[0].trim()})`, 'ok');
      } else {
        card.innerHTML = `
          <div class="feed-header">
            <div class="feed-tag"><span>CAM-${String(i+1).padStart(2, '0')}</span> // ${node.name}</div>
            <div class="rec-badge"><span class="blink">●</span> REC</div>
          </div>
          <div class="offline-overlay">[ SIGNAL LOST / NO URL ]</div>
          <div class="scanlines"></div>
        `;
      }

      matrix.appendChild(card);
    });

    // PETA SATELIT ESRI
    const map = L.map('map', { center: [20, 10], zoom: 1, zoomControl: false, attributionControl: false });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);

    const pin = L.divIcon({
      html: '<div style="width:7px;height:7px;background:#00ff41;border-radius:50%;box-shadow:0 0 8px #00ff41;"></div>',
      iconSize: [7, 7]
    });

    cctvNodes.forEach(node => {
      L.marker([node.lat, node.lng], { icon: pin }).addTo(map);
    });

    function addLog(msg, type) {
      logs.innerHTML += `<div class="${type}">${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    setInterval(() => {
      document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('id-ID') + ' WIB';
    }, 1000);
  </script>
</body>
</html>
